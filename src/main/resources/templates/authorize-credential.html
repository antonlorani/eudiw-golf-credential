<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D8E2F5">
  <title th:text="${config.headline}">Select A Credential</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div class="page page--blue">

    <form method="post" th:action="@{/authorize}">
      <input type="hidden" name="offerId" th:value="${offerId}">
      <input type="hidden" name="selection" id="credentialSelection" value="0">

      <div class="page__content">
        <h1 th:replace="~{fragments/components :: headline(${config.headline})}">Headline</h1>

        <p th:replace="~{fragments/components :: infoText(${config.infoText})}">Info</p>

        <div style="width: 100%; margin-top: 12px;">
          <th:block th:each="credential, iterStat : ${config.credentials}">
            <div class="credential-item"
                 th:attr="data-index=${iterStat.index}"
                 th:classappend="${iterStat.index == 0 ? ' selected' : ''}"
                 onclick="selectCredential(this)">
              <div class="selectable-radio">
                <div class="selectable-radio__inner"></div>
              </div>
              <div class="credential-item__content">
                <span class="credential-item__title" th:text="${credential.title}">Credential</span>
                <span class="credential-item__subtitle" th:text="${credential.subtitle}">Details</span>
              </div>
            </div>
          </th:block>
        </div>
      </div>

      <div class="page__actions">
        <button type="submit" class="blue-cta-button" th:text="${config.primaryButtonLabel}">Authorize</button>
      </div>
    </form>

    <footer th:replace="~{fragments/components :: mobileFooter(${config.footerText})}">Footer</footer>

  </div>

  <script>
    function selectCredential(element) {
      document.querySelectorAll('.credential-item').forEach(function(item) {
        item.classList.remove('selected');
      });
      element.classList.add('selected');
      document.getElementById('credentialSelection').value = element.dataset.index;
    }
  </script>
</body>
</html>
