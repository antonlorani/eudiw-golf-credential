<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${config.headline}">Select A Credential</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div class="page page--blue">

    <div class="page__content">
      <h1 th:replace="~{fragments/components :: headline(${config.headline})}">Headline</h1>

      <p th:replace="~{fragments/components :: infoText(${config.infoText})}">Info</p>

      <div style="width: 100%; margin-top: 12px;">
        <th:block th:each="credential : ${config.credentials}">
          <div th:replace="~{fragments/components :: credentialItem(${credential})}">Credential</div>
        </th:block>
      </div>
    </div>

    <div class="page__actions">
      <a th:replace="~{fragments/components :: blueCtaButton(${config.primaryButtonLabel}, '/success')}">Authorize</a>
    </div>

    <footer th:replace="~{fragments/components :: mobileFooter(${config.footerText})}">Footer</footer>

  </div>

  <script>
    function selectItem(element, className) {
      document.querySelectorAll('.' + className).forEach(function(item) {
        item.classList.remove('selected');
      });
      element.classList.add('selected');
    }
  </script>
</body>
</html>
