<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${config.headline}">Verify Your HCP</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <meta http-equiv="refresh" content="3">
</head>
<body>
  <div class="page page--green">

    <div class="page__content">
      <div th:replace="~{fragments/components :: trailingProgress(3)}">Progress</div>

      <h1 th:replace="~{fragments/components :: headline(${config.headline})}">Headline</h1>

      <p th:replace="~{fragments/components :: infoText(${config.infoText})}">Info</p>
    </div>

    <div class="page__actions">
      <a th:href="${deeplinkUrl}" class="secondary-cta-button" th:text="${config.secondaryButtonLabel}">Verify</a>
    </div>

    <footer th:replace="~{fragments/components :: mobileFooter(${config.footerText})}">Footer</footer>

  </div>
</body>
</html>
