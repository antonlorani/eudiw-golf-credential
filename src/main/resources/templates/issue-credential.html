<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${config.headline}">Issue A Credential</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div class="page page--green">

    <div class="page__content">
      <div th:replace="~{fragments/components :: leadingProgress(1)}">Progress</div>

      <h1 th:replace="~{fragments/components :: headline(${config.headline})}">Headline</h1>

      <p th:replace="~{fragments/components :: infoText(${config.infoText})}">Info</p>
    </div>

    <div class="page__actions">
      <a th:replace="~{fragments/components :: secondaryCtaButton(${config.secondaryButtonLabel}, '/authorize-credential')}">Secondary</a>
      <form method="post" th:action="@{/demo}" style="width: 100%;">
        <button type="submit" class="cta-button" th:text="${config.primaryButtonLabel}">Continue</button>
      </form>
    </div>

    <footer th:replace="~{fragments/components :: mobileFooter(${config.footerText})}">Footer</footer>

  </div>
</body>
</html>
