<!DOCTYPE html>
<html lang="en" class="theme-green" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3F8E9">
  <title th:text="${config.headline}">Issue A Credential</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="theme-green">
  <div class="page page--green">

    <div class="page__content">
      <div th:replace="~{fragments/components :: leadingProgress(1)}">Progress</div>

      <h1 th:replace="~{fragments/components :: headline(${config.headline})}">Headline</h1>

      <p th:replace="~{fragments/components :: infoText(${config.infoText})}">Info</p>
    </div>

    <div class="page__actions">
      <div class="desktop-qr-code">
        <img th:src="${qrCodeDataUrl}" alt="Scan to issue a credential">
      </div>
      <a th:href="${issueDeeplinkUrl}" class="cta-button mobile-wallet-action" th:text="${config.primaryButtonLabel}">Offer Credential</a>
      <form method="post" th:action="@{/demo}" style="width: 100%;">
        <button type="submit" class="secondary-cta-button" th:text="${config.secondaryButtonLabel}">Skip</button>
      </form>
    </div>

    <footer th:replace="~{fragments/components :: mobileFooter(${config.footerText})}">Footer</footer>

  </div>
</body>
</html>
