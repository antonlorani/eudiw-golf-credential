<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BulletPoint_List</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; }

  .bulletpoint-list {
    width: 342px;
    background-color: #FFFFFF;
    border-radius: 20px;
    padding: 20px 12px 0 12px;
  }

  .bulletpoint-list__item {
    width: 318px;
    height: 65px;
    display: flex;
    align-items: flex-start;
  }

  .bulletpoint-list__symbol {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #CEE5A7;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'SF Pro Display', system-ui, sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #415925;
    line-height: 1;
  }

  .bulletpoint-list__text {
    margin-left: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'SF Pro Display', system-ui, sans-serif;
    font-weight: 500;
    font-size: 17px;
    color: #3C3C3C;
    line-height: normal;
    display: flex;
    align-items: center;
    min-height: 40px;
  }
</style>
</head>
<body>
  <div class="bulletpoint-list">
    <div class="bulletpoint-list__item">
      <div class="bulletpoint-list__symbol">1</div>
      <span class="bulletpoint-list__text">Issue a golf membership credential into your EUDI Wallet</span>
    </div>
    <div class="bulletpoint-list__item">
      <div class="bulletpoint-list__symbol">2</div>
      <span class="bulletpoint-list__text">Select a golf course or tournament</span>
    </div>
    <div class="bulletpoint-list__item">
      <div class="bulletpoint-list__symbol">3</div>
      <span class="bulletpoint-list__text">Verify your HCP through your EUDI Wallet</span>
    </div>
    <div class="bulletpoint-list__item">
      <div class="bulletpoint-list__symbol">4</div>
      <span class="bulletpoint-list__text">Will the credential be accepted as proof?</span>
    </div>
  </div>
</body>
</html>
