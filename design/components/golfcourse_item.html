<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolfCourse_Item</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; gap: 16px; }

  .golfcourse-item {
    width: 342px;
    height: 64px;
    border-radius: 20px;
    background-color: #FFFFFF;
    display: flex;
    align-items: center;
    padding: 0 12px;
    cursor: pointer;
  }

  .golfcourse-item__radio {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #C9C9C9;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .golfcourse-item__radio-inner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background-color: #C9C9C9;
    border: 2px solid #C9C9C9;
    display: none;
  }

  .golfcourse-item.selected .golfcourse-item__radio-inner {
    display: block;
  }

  .golfcourse-item__content {
    margin-left: 17px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .golfcourse-item__title {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'SF Pro Display', system-ui, sans-serif;
    font-weight: 500;
    font-size: 15px;
    color: #3C3C3C;
    line-height: 18px;
  }

  .golfcourse-item__subtitle {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'SF Pro Display', system-ui, sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: #848383;
    line-height: 14px;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <!-- Deselected state -->
  <div class="golfcourse-item">
    <div class="golfcourse-item__radio">
      <div class="golfcourse-item__radio-inner"></div>
    </div>
    <div class="golfcourse-item__content">
      <span class="golfcourse-item__title">Royal St. Andrews Links</span>
      <span class="golfcourse-item__subtitle">HCP requirement &lt;= 24</span>
    </div>
  </div>

  <!-- Selected state -->
  <div class="golfcourse-item selected">
    <div class="golfcourse-item__radio">
      <div class="golfcourse-item__radio-inner"></div>
    </div>
    <div class="golfcourse-item__content">
      <span class="golfcourse-item__title">Royal St. Andrews Links</span>
      <span class="golfcourse-item__subtitle">HCP requirement &lt;= 24</span>
    </div>
  </div>
</body>
</html>
