<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkmark_Symbol</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; }

  .checkmark-symbol {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: #CEE5A7;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .checkmark-symbol svg {
    width: 40px;
    height: 40px;
  }
</style>
</head>
<body>
  <div class="checkmark-symbol">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 20.5L16 28.5L32 12.5" stroke="#415925" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</body>
</html>
