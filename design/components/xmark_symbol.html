<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XMark_Symbol</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; }

  .xmark-symbol {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: #D84C4C;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .xmark-symbol svg {
    width: 36px;
    height: 36px;
  }
</style>
</head>
<body>
  <div class="xmark-symbol">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 8L28 28M28 8L8 28" stroke="#592525" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</body>
</html>
