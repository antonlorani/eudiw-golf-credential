<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallToAction_Button</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; }

  .cta-button {
    width: 342px;
    height: 48px;
    border-radius: 37px;
    background-color: #CEE5A7;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'SF Pro Display', system-ui, sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #000000;
    line-height: 1;
  }
</style>
</head>
<body>
  <button class="cta-button">Start</button>
</body>
</html>
